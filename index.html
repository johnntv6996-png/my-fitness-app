<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0a0a0f">
<title>FITNESS ELITE — Premium Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
:root {
  --bg-primary: #0a0a0f;
  --bg-secondary: #151520;
  --bg-card: rgba(255, 255, 255, 0.03);
  --bg-glass: rgba(255, 255, 255, 0.05);
  --text-primary: #ffffff;
  --text-secondary: #a0a0b0;
  --text-muted: #6a6a7a;
  --accent-gold: #d4af37;
  --accent-gold-light: #f4d03f;
  --accent-gold-dim: rgba(212, 175, 55, 0.15);
  --accent-success: #4ade80;
  --accent-error: #f87171;
  --accent-warning: #fbbf24;
  --accent-info: #60a5fa;
  --accent-neon: #60a5fa;
  --border-subtle: rgba(255, 255, 255, 0.08);
  --border-gold: rgba(212, 175, 55, 0.3);
  --shadow-gold: 0 0 40px rgba(212, 175, 55, 0.2);
  --font-primary: 'Inter', sans-serif;
  --font-display: 'Playfair Display', serif;
  --radius-sm: 8px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

body.light-theme {
  --bg-primary: #f5f2eb;
  --bg-secondary: #ebe7dd;
  --bg-card: rgba(0, 0, 0, 0.03);
  --bg-glass: rgba(255, 255, 255, 0.7);
  --text-primary: #1a1a1f;
  --text-secondary: #5a5a6a;
  --text-muted: #8a8a9a;
  --accent-gold: #a67c00;
  --accent-gold-light: #d4af37;
  --accent-gold-dim: rgba(166, 124, 0, 0.12);
  --accent-success: #16a34a;
  --accent-error: #dc2626;
  --accent-warning: #d97706;
  --accent-info: #0284c7;
  --accent-neon: #0284c7;
  --border-subtle: rgba(0, 0, 0, 0.08);
  --border-gold: rgba(166, 124, 0, 0.3);
  --shadow-gold: 0 0 40px rgba(166, 124, 0, 0.15);
}

body.light-theme .header { background: linear-gradient(135deg, rgba(212, 175, 55, 0.15) 0%, rgba(212, 175, 55, 0.05) 100%); }
body.light-theme .workout-modal, body.light-theme .survey-modal, body.light-theme .ex-modal, body.light-theme .calendar-modal { background: rgba(245, 242, 235, 0.9); }
body.light-theme .console-log { background: #1a1a1f; color: #4ade80; }

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: var(--font-primary);
  font-size: 16px;
  overflow-x: hidden;
  transition: background 0.3s, color 0.3s;
  background-image: 
    radial-gradient(circle at 20% 50%, rgba(212, 175, 55, 0.05) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(212, 175, 55, 0.03) 0%, transparent 50%);
}

body.light-theme {
  background-image: 
    radial-gradient(circle at 20% 50%, rgba(212, 175, 55, 0.08) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(212, 175, 55, 0.05) 0%, transparent 50%);
}

select, input[type="text"], input[type="number"], input[type="time"], input[type="date"], input[type="email"], textarea {
  background: var(--bg-primary) !important;
  color: var(--text-primary) !important;
  border: 1px solid var(--border-subtle) !important;
  font-family: var(--font-primary);
}
select:focus, input:focus, textarea:focus { outline: none; border-color: var(--border-gold) !important; }
select option { background: var(--bg-secondary) !important; color: var(--text-primary) !important; }

.header-wrapper {
  position: sticky;
  top: 0;
  z-index: 10000;
  padding: 8px 12px;
  background: var(--bg-primary);
  transition: background 0.3s;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 18px;
  background: linear-gradient(135deg, rgba(212, 175, 55, 0.08) 0%, rgba(212, 175, 55, 0.03) 100%);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  border-radius: var(--radius-md);
  border: 1px solid var(--border-gold);
  box-shadow: var(--shadow-gold);
  position: relative;
  overflow: hidden;
  transition: all var(--transition-fast);
}

.header::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
  animation: shimmer 3s ease-in-out infinite;
}

@keyframes shimmer { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

.header-left { display: flex; align-items: center; gap: 12px; }
.header-right { display: flex; align-items: center; gap: 8px; }

.header h1 { 
  margin: 0; 
  font-family: var(--font-display);
  font-size: 1.3em;
  font-weight: 900;
  background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-gold-light) 50%, var(--accent-gold) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
}

.header h1 i { font-size: 1.1em; -webkit-text-fill-color: var(--accent-gold); }

.theme-btn {
  width: 36px; height: 36px;
  border-radius: 50%;
  background: var(--bg-glass);
  border: 1px solid var(--border-subtle);
  color: var(--text-secondary);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1em;
  transition: all var(--transition-fast);
}

.theme-btn:hover { background: rgba(212, 175, 55, 0.1); border-color: var(--border-gold); color: var(--accent-gold); transform: translateY(-2px); }
.theme-btn.active { background: var(--accent-gold); color: #000; border-color: var(--accent-gold); box-shadow: 0 0 20px rgba(212, 175, 55, 0.4); }

.hamburger {
  width: 38px; height: 38px;
  background: var(--bg-glass);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 5px;
  transition: all var(--transition-fast);
  flex-shrink: 0;
}

.hamburger:hover { background: rgba(212, 175, 55, 0.1); border-color: var(--border-gold); }
.hamburger span { display: block; width: 20px; height: 2px; background: var(--accent-gold); border-radius: 2px; transition: all var(--transition-fast); }
.hamburger.active span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.hamburger.active span:nth-child(2) { opacity: 0; }
.hamburger.active span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

.sidebar-overlay {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(8px);
  z-index: 998;
  opacity: 0; visibility: hidden;
  transition: all var(--transition-fast);
}
.sidebar-overlay.active { opacity: 1; visibility: visible; }

.sidebar {
  position: fixed; top: 0; left: 0;
  width: 320px; max-width: 85vw;
  height: 100vh;
  background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
  border-right: 1px solid var(--border-gold);
  z-index: 999;
  transform: translateX(-100%);
  transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  overflow-y: auto;
  padding: 20px 0;
  box-shadow: 10px 0 40px rgba(0, 0, 0, 0.5);
}
.sidebar.active { transform: translateX(0); }

.sidebar-header { padding: 0 20px 16px; border-bottom: 1px solid var(--border-subtle); margin-bottom: 12px; }
.sidebar-header h2 { font-family: var(--font-display); color: var(--accent-gold); font-size: 1.2em; display: flex; align-items: center; gap: 10px; }

.sidebar-profile {
  padding: 16px 20px;
  margin: 0 16px 16px;
  border-radius: var(--radius-md);
  background: linear-gradient(135deg, rgba(212, 175, 55, 0.08) 0%, rgba(212, 175, 55, 0.02) 100%);
  border: 1px solid var(--border-gold);
  cursor: pointer;
  transition: all var(--transition-fast);
}

.sidebar-profile:hover { 
  background: linear-gradient(135deg, rgba(212, 175, 55, 0.15) 0%, rgba(212, 175, 55, 0.05) 100%);
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(212, 175, 55, 0.2);
}

.sidebar-profile-top {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 12px;
}

.sidebar-profile-avatar {
  width: 52px; height: 52px;
  border-radius: 50%;
  border: 2px solid var(--accent-gold);
  overflow: hidden;
  background: var(--bg-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  box-shadow: 0 0 12px rgba(212, 175, 55, 0.3);
}

.sidebar-profile-avatar img { width: 100%; height: 100%; object-fit: cover; }
.sidebar-profile-avatar i { font-size: 1.8em; color: var(--accent-gold); }

.sidebar-profile-info { flex: 1; min-width: 0; }

.sidebar-profile-name {
  font-weight: 700;
  font-size: 1.05em;
  color: var(--text-primary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  display: flex;
  align-items: center;
  gap: 6px;
}

.sidebar-profile-name i { font-size: 0.85em; color: var(--accent-gold); opacity: 0.7; }

.sidebar-profile-sub {
  font-size: 0.75em;
  color: var(--text-secondary);
  margin-top: 2px;
}

.profile-level-block {
  background: rgba(0,0,0,0.2);
  border-radius: 10px;
  padding: 10px 12px;
  border: 1px solid var(--border-subtle);
}

body.light-theme .profile-level-block {
  background: rgba(166, 124, 0, 0.08);
}

.profile-level-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
}

.profile-level-left {
  display: flex;
  align-items: center;
  gap: 8px;
}

.profile-level-icon {
  font-size: 1.3em;
  color: var(--accent-gold);
  animation: levelPulse 3s ease-in-out infinite;
}

@keyframes levelPulse {
  0%, 100% { transform: scale(1); filter: drop-shadow(0 0 2px var(--accent-gold)); }
  50% { transform: scale(1.1); filter: drop-shadow(0 0 8px var(--accent-gold)); }
}

@media (prefers-reduced-motion: reduce) {
  .header::before, .profile-level-icon, .loading .icon-large, .profile-xp-fill::after { animation: none !important; }
}

.profile-level-num {
  font-family: var(--font-display);
  font-size: 1.4em;
  font-weight: 900;
  color: var(--accent-gold);
  line-height: 1;
  display: flex;
  align-items: baseline;
  gap: 4px;
}

.profile-level-label {
  font-family: var(--font-primary);
  font-size: 0.55em;
  font-weight: 500;
  color: var(--text-secondary);
  opacity: 0.8;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.profile-xp-block {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 90px;
}

.profile-xp-text {
  display: flex;
  justify-content: space-between;
  font-size: 0.7em;
  color: var(--text-secondary);
}

.profile-xp-text strong {
  color: var(--accent-gold);
  font-weight: 700;
}

.profile-xp-bar {
  height: 5px;
  background: rgba(0,0,0,0.4);
  border-radius: 3px;
  overflow: hidden;
  border: 1px solid var(--border-subtle);
  position: relative;
}

body.light-theme .profile-xp-bar {
  background: rgba(166, 124, 0, 0.15);
}

.profile-xp-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent-gold), var(--accent-gold-light));
  border-radius: 3px;
  transition: width 1s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  overflow: hidden;
}

.profile-xp-fill::after {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
  animation: xpShine 2.5s ease-in-out infinite;
}

@keyframes xpShine {
  0% { left: -100%; }
  100% { left: 100%; }
}

.profile-xp-fill.xp-gained {
  animation: xpGain 0.8s ease-out;
}

@keyframes xpGain {
  0% { filter: brightness(1); }
  50% { filter: brightness(1.8); box-shadow: 0 0 12px var(--accent-gold); }
  100% { filter: brightness(1); }
}

.profile-ach-hint {
  font-size: 0.65em;
  color: var(--text-muted);
  display: flex;
  align-items: center;
  gap: 4px;
  margin-top: 2px;
}

.profile-ach-hint i {
  color: var(--accent-gold);
  font-size: 0.9em;
}

.sidebar-section { padding: 0 16px; margin-bottom: 12px; }
.sidebar-section-title {
  font-size: 0.7em;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-secondary);
  opacity: 0.6;
  padding: 0 12px 6px;
  font-weight: 600;
}

.sidebar-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  margin-bottom: 3px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  color: var(--text-secondary);
  font-weight: 500;
  font-size: 0.92em;
  transition: all var(--transition-fast);
  border: 1px solid transparent;
}
.sidebar-item:hover { background: var(--accent-gold-dim); color: var(--text-primary); border-color: var(--border-subtle); transform: translateX(3px); }
.sidebar-item.active { background: var(--accent-gold-dim); color: var(--accent-gold); border-color: var(--border-gold); font-weight: 600; }
.sidebar-item i { font-size: 1.2em; width: 22px; text-align: center; color: var(--accent-gold); }

.sidebar-divider { height: 1px; background: var(--border-subtle); margin: 8px 20px 12px; }

.main-content { 
  max-width: 1200px; 
  margin: 0 auto; 
  padding: 0 12px 30px;
  animation: fadeIn 0.5s ease-out; 
}
@keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

.screen { display: none; }
.screen.active { display: block; animation: fadeIn 0.4s ease-out; }

.dev-panel { background: var(--bg-glass); backdrop-filter: blur(20px); padding: 20px; border-radius: var(--radius-md); margin-bottom: 16px; border: 1px solid var(--border-subtle); }

.module-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 16px;
  background: var(--bg-card);
  border-radius: var(--radius-md);
  margin-bottom: 10px;
  border: 1px solid var(--border-subtle);
  transition: all var(--transition-fast);
  flex-wrap: wrap;
  gap: 10px;
}
.module-item:hover { background: rgba(255, 255, 255, 0.05); transform: translateX(3px); border-color: var(--border-gold); }
.module-item.loaded { border-left: 3px solid var(--accent-success); }
.module-item.loading { border-left: 3px solid var(--accent-gold); }
.module-item.error { border-left: 3px solid var(--accent-error); }

.btn {
  padding: 10px 18px;
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  font-weight: 600;
  font-size: 0.92em;
  transition: all var(--transition-fast);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-family: var(--font-primary);
  white-space: nowrap;
}
.btn:active { transform: scale(0.97); }
.btn-primary { background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-gold-light) 100%); color: #000; box-shadow: var(--shadow-gold); }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(212, 175, 55, 0.4); }
.btn-secondary { background: var(--bg-glass); color: var(--text-primary); border: 1px solid var(--border-subtle); }
.btn-secondary:hover { background: rgba(255, 255, 255, 0.08); transform: translateY(-2px); }
.btn-danger { background: linear-gradient(135deg, var(--accent-error) 0%, #ef4444 100%); color: #fff; }
.btn-danger:hover { transform: translateY(-2px); }
.btn-success { background: linear-gradient(135deg, var(--accent-success) 0%, #22c55e 100%); color: #000; }

.console-log {
  background: #000;
  color: var(--accent-success);
  padding: 16px;
  border-radius: var(--radius-md);
  font-family: 'Courier New', monospace;
  font-size: 0.85em;
  max-height: 400px;
  overflow-y: auto;
  margin-top: 12px;
  border: 1px solid var(--border-subtle);
}
.console-log .error { color: var(--accent-error); }
.console-log .warn { color: var(--accent-warning); }
.console-log .info { color: var(--accent-gold); }

.loading { text-align: center; padding: 60px 30px; opacity: 0.6; }
.loading h2 { font-family: var(--font-display); font-size: 2em; margin: 16px 0; background: linear-gradient(135deg, var(--accent-gold), var(--accent-gold-light)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.loading .icon-large { font-size: 3.5em; color: var(--accent-gold); animation: pulse 2s infinite; }
@keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.7; transform: scale(1.05); } }

.text-small { font-size: 0.85em; opacity: 0.7; color: var(--text-secondary); }

.workout-modal, .survey-modal, .ex-modal, .calendar-modal {
  position: fixed; top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.9);
  backdrop-filter: blur(15px);
  z-index: 2000;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 16px;
  animation: fadeIn 0.3s ease-out;
}
body.light-theme .workout-modal, body.light-theme .survey-modal, body.light-theme .ex-modal, body.light-theme .calendar-modal { background: rgba(245, 242, 235, 0.9); }

.workout-modal-content, .survey-modal-content, .ex-modal-content, .calendar-content {
  background: var(--bg-secondary);
  padding: 24px;
  border-radius: var(--radius-lg);
  width: 100%;
  max-width: 560px;
  max-height: 90vh;
  overflow-y: auto;
  border: 1px solid var(--border-gold);
  box-shadow: var(--shadow-gold);
  animation: scaleIn 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
}
@keyframes scaleIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

.achievement-toast {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%) translateY(-150%);
  background: linear-gradient(135deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
  border: 2px solid var(--accent-gold);
  border-radius: 16px;
  padding: 18px 24px;
  box-shadow: 0 0 40px rgba(212, 175, 55, 0.5), 0 10px 30px rgba(0,0,0,0.5);
  z-index: 10000;
  display: flex;
  align-items: center;
  gap: 14px;
  transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55);
  max-width: 90vw;
}

.achievement-toast.show { transform: translateX(-50%) translateY(0); }
.achievement-toast .ach-icon { font-size: 2.2em; color: var(--accent-gold); animation: achBounce 0.6s ease-out; }
@keyframes achBounce { 0% { transform: scale(0) rotate(-180deg); } 60% { transform: scale(1.3) rotate(10deg); } 100% { transform: scale(1) rotate(0); } }
.achievement-toast .ach-text { flex: 1; }
.achievement-toast .ach-title { font-family: var(--font-display); color: var(--accent-gold); font-size: 1em; font-weight: 700; margin-bottom: 3px; }
.achievement-toast .ach-desc { color: var(--text-secondary); font-size: 0.82em; }

.achievement-particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 9999; }
.achievement-particle {
  position: absolute;
  width: 8px; height: 8px;
  background: var(--accent-gold);
  border-radius: 50%;
  animation: particleFall 1.5s ease-out forwards;
}
@keyframes particleFall { 0% { transform: translateY(0) scale(1); opacity: 1; } 100% { transform: translateY(100vh) scale(0); opacity: 0; } }

/* Notify (toast-уведомления для модулей) */
.notify-container {
  position: fixed;
  top: 80px;
  right: 20px;
  z-index: 10500;
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-width: 340px;
  pointer-events: none;
}
.notify-toast {
  background: var(--bg-secondary);
  border: 1px solid var(--border-gold);
  border-left: 3px solid var(--accent-gold);
  border-radius: 12px;
  padding: 12px 16px;
  font-size: 0.9em;
  box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  color: var(--text-primary);
  pointer-events: auto;
  animation: notifyIn 0.3s ease-out;
  display: flex;
  align-items: start;
  gap: 10px;
}
.notify-toast.success { border-left-color: var(--accent-success); }
.notify-toast.warn { border-left-color: var(--accent-warning); }
.notify-toast.error { border-left-color: var(--accent-error); }
.notify-toast .notify-icon { font-size: 1.2em; color: var(--accent-gold); margin-top: 1px; }
.notify-toast.success .notify-icon { color: var(--accent-success); }
.notify-toast.warn .notify-icon { color: var(--accent-warning); }
.notify-toast.error .notify-icon { color: var(--accent-error); }
@keyframes notifyIn { from { opacity: 0; transform: translateX(20px); } to { opacity: 1; transform: translateX(0); } }

/* ============================================================
   Logger — уровни + фильтр + инкрементальный рендер
   ============================================================ */
const Logger = {
  logs: [],
  level: 'info',
  maxLogs: 500,
  _levels: { debug: 0, info: 1, warn: 2, error: 3 },

  log: function(message, type) {
    type = type || 'info';
    if (this._levels[type] < this._levels[this.level]) return;
    var timestamp = new Date().toLocaleTimeString();
    this.logs.push({ timestamp: timestamp, message: message, type: type });
    if (this.logs.length > this.maxLogs) this.logs.shift();
    if (type === 'error') console.error('[' + timestamp + '] ' + message);
    else if (type === 'warn') console.warn('[' + timestamp + '] ' + message);
    else if (type === 'debug') console.debug('[' + timestamp + '] ' + message);
    else console.log('[' + timestamp + '] ' + message);
    this.appendToConsole({ timestamp: timestamp, message: message, type: type });
  },

  setLevel: function(level) { this.level = level; },
  debug: function(m) { this.log(m, 'debug'); },
  info: function(m) { this.log(m, 'info'); },
  warn: function(m) { this.log(m, 'warn'); },
  error: function(m) { this.log(m, 'error'); },

  appendToConsole: function(log) {
    var container = document.getElementById('consoleLog');
    if (!container) return;
    var div = document.createElement('div');
    div.className = log.type;
    div.textContent = '[' + log.timestamp + '] ' + log.message;
    container.appendChild(div);
    container.scrollTop = container.scrollHeight;
  },

  renderConsole: function() {
    var container = document.getElementById('consoleLog');
    if (!container) return;
    container.innerHTML = '';
    for (var i = 0; i < this.logs.length; i++) this.appendToConsole(this.logs[i]);
  },

  clear: function() { this.logs = []; this.renderConsole(); },

  export: function() {
    var text = this.logs.map(function(l) {
      return '[' + l.timestamp + '] [' + l.type + '] ' + l.message;
    }).join('\n');
    var blob = new Blob([text], { type: 'text/plain' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = 'fitness_logs_' + new Date().toISOString().slice(0, 10) + '.txt';
    a.click();
    URL.revokeObjectURL(url);
  }
};

/* ============================================================

const Notify = {
  _show: function(message, type, icon, duration) {
    var container = document.getElementById('notifyContainer');
    if (!container) return;
    var toast = document.createElement('div');
    toast.className = 'notify-toast ' + type;
    toast.innerHTML = '<i class="ph ' + icon + ' notify-icon"></i><div>' + String(message).replace(/[<>]/g, '') + '</div>';
    container.appendChild(toast);
    setTimeout(function() {
      toast.style.animation = 'notifyOut 0.3s ease-out forwards';
      setTimeout(function() { toast.remove(); }, 320);
    }, duration || 3000);
  },
  info: function(m) { this._show(m, 'info', 'ph-info'); },
  success: function(m) { this._show(m, 'success', 'ph-check-circle'); },
  warn: function(m) { this._show(m, 'warn', 'ph-warning'); },
  error: function(m) { this._show(m, 'error', 'ph-x-circle'); },

  confirm: function(message) {
    return new Promise(function(resolve) {

};

/* ============================================================

function getTheme() {
  try {
    var settings = JSON.parse(localStorage.getItem('ft_settings')) || {};
    return settings.theme || 'dark';
  } catch (e) { return 'dark'; }
}

function setTheme(theme) {
  if (theme === 'light') {
    document.body.classList.add('light-theme');
  } else {
    document.body.classList.remove('light-theme');
  }
  try {
    var settings = JSON.parse(localStorage.getItem('ft_settings')) || {};
    settings.theme = theme;
    localStorage.setItem('ft_settings', JSON.stringify(settings));
  } catch (e) {}
  var darkBtn = document.getElementById('themeDarkBtn');
  var lightBtn = document.getElementById('themeLightBtn');
  if (darkBtn) darkBtn.classList.toggle('active', theme === 'dark');
  if (lightBtn) lightBtn.classList.toggle('active', theme === 'light');
  if (typeof Logger !== 'undefined') Logger.info('Тема изменена: ' + theme);
}

function applyTheme() {
  var theme = getTheme();
  document.body.classList.toggle('light-theme', theme === 'light');
  var darkBtn = document.getElementById('themeDarkBtn');
  var lightBtn = document.getElementById('themeLightBtn');
  if (darkBtn) darkBtn.classList.toggle('active', theme === 'dark');
  if (lightBtn) lightBtn.classList.toggle('active', theme === 'light');
}

function uploadAvatarFromProfile() {
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.onchange = function(e) {
    var file = e.target.files[0];
    if (!file) return;
    if (file.size > 2 * 1024 * 1024) {
      if (typeof Notify !== 'undefined') Notify.warn('Файл слишком большой. Максимум 2 МБ.'); else alert('Файл слишком большой. Максимум 2 МБ.');
      return;
    }
    var reader = new FileReader();
    reader.onload = function(ev) {
      var img = new Image();
      img.onload = function() {
        var canvas = document.createElement('canvas');
        var size = 200;
        canvas.width = size; canvas.height = size;
        var ctx = canvas.getContext('2d');
        var minDim = Math.min(img.width, img.height);
        var sx = (img.width - minDim) / 2;
        var sy = (img.height - minDim) / 2;
        ctx.drawImage(img, sx, sy, minDim, minDim, 0, 0, size, size);
        var dataUrl = canvas.toDataURL('image/jpeg', 0.85);
        localStorage.setItem('ft_user_avatar', JSON.stringify(dataUrl));
        var modal = document.getElementById('profileModal');
        if (modal) modal.remove();
        updateSidebarProfile();
        if (typeof Notify !== 'undefined') Notify.success('Аватар обновлён!'); else alert('Аватар обновлён!');
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  };
  input.click();
}

function submitBugReport() {
  var title = document.getElementById('bugTitle').value.trim();
  var description = document.getElementById('bugDescription').value.trim();
  var steps = document.getElementById('bugSteps').value.trim();
  var severity = document.getElementById('bugSeverity').value;

  if (!title) { if (typeof Notify !== 'undefined') Notify.warn('Введи заголовок'); else alert('Введи заголовок'); return; }
  if (!description) { if (typeof Notify !== 'undefined') Notify.warn('Введи описание'); else alert('Введи описание'); return; }

  var reports = getBugReports();
  reports.unshift({
    id: 'bug_' + Date.now(),
    title: title,
    description: description,
    steps: steps,
    severity: severity,
    timestamp: Date.now(),
    status: 'new'
  });
  saveBugReports(reports);
  var modal = document.getElementById('bugReportModal');
  if (modal) modal.remove();
  if (typeof Notify !== 'undefined') Notify.success('Баг-репорт сохранён! Спасибо!'); else alert('✅ Баг-репорт сохранён! Спасибо!');
  Logger.warn('Баг-репорт: ' + title);
}

  openBugReportModal();

/* ============================================================
   Header XP/Level — использует Core.utils (если доступен)
   ============================================================ */
function updateHeaderLevel() {
  var stats = _safeParse('ft_stats', {xp:0, level:1, streak:0, yes:0});
  if (!stats) return;

  var level = stats.level || 1;
  var xp = stats.xp || 0;
  var xpNeeded = level * 100;
  var xpPercent = xpNeeded > 0 ? Math.min(100, Math.round((xp / xpNeeded) * 100)) : 0;

  // Используем Core.utils, если доступен
  var levelIcon = (typeof Core !== 'undefined' && Core.utils && Core.utils.getLevelIcon)
    ? Core.utils.getLevelIcon(level)
    : (level >= 50 ? 'ph-diamond' : level >= 20 ? 'ph-crown' : level >= 10 ? 'ph-trophy' : level >= 5 ? 'ph-star-four' : 'ph-star');

  var iconEl = document.getElementById('headerLevelIcon');
  if (iconEl) {
    iconEl.className = 'ph ' + levelIcon + ' profile-level-icon';
  }

  var numEl = document.getElementById('headerLevelNum');
  if (numEl) {
    var oldVal = parseInt(numEl.textContent) || 0;
    if (oldVal !== level) animateNumber(numEl, oldVal, level, 600);
    else numEl.textContent = level;
  }

  var xpCurEl = document.getElementById('headerXpCurrent');
  if (xpCurEl) {
    var oldXp = parseInt(xpCurEl.textContent) || 0;
    if (oldXp !== xp) animateNumber(xpCurEl, oldXp, xp, 800);
    else xpCurEl.textContent = xp;
  }

  var xpNeedEl = document.getElementById('headerXpNeeded');
  if (xpNeedEl) xpNeedEl.textContent = xpNeeded;

  var fillEl = document.getElementById('headerXpFill');
  if (fillEl) {
    var oldWidth = parseFloat(fillEl.style.width) || 0;
    fillEl.style.width = xpPercent + '%';
    if (Math.abs(oldWidth - xpPercent) > 1) {
      fillEl.classList.remove('xp-gained');
      void fillEl.offsetWidth;
      fillEl.classList.add('xp-gained');
      setTimeout(function() { fillEl.classList.remove('xp-gained'); }, 800);
    }
  }

  var achThresholds = [5, 10, 20, 50, 100];
  var nextAch = null;
  for (var i = 0; i < achThresholds.length; i++) {
    if (level < achThresholds[i]) { nextAch = achThresholds[i]; break; }
  }
  var achText = document.getElementById('headerAchText');
  if (achText) {
    if (nextAch) {
      var totalXp = xp + (level - 1) * 100;
      var nextTotalXp = (nextAch - 1) * 100;
      var xpToNext = Math.max(0, nextTotalXp - totalXp);
      achText.textContent = 'до ур. ' + nextAch + ': ' + xpToNext + ' XP';
    } else {
      achText.textContent = 'Максимальный уровень!';
    }
  }
}

function animateNumber(el, from, to, duration) {
  var start = null;
  var range = to - from;
  function step(timestamp) {
    if (!start) start = timestamp;
    var progress = Math.min((timestamp - start) / duration, 1);
    var eased = 1 - Math.pow(1 - progress, 3);
    el.textContent = Math.floor(from + range * eased);
    if (progress < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ============================================================
   ModuleManager
   ============================================================ */
class ModuleManager {
  constructor() {
    this.loadedModules = new Map();
    this.moduleStatus = new Map();
    this.fetchController = null;
  }

  async init() {
    Logger.info('Инициализация менеджера модулей...');
    applyTheme();
    updateSidebarProfile();
    updateHeaderLevel();
    await this.loadAllModules();
    this.renderModuleList();
    this.initializeUserInterface();
  }

  async loadAllModules() {
    // core — первым, последовательно
    if (MODULE_REGISTRY.core) {
      await this.loadModule('core', MODULE_REGISTRY.core);
    }
    // остальные — параллельно
    var ids = [];
    for (var id in MODULE_REGISTRY) {
      if (id !== 'core') ids.push(id);
    }
    var self = this;
    await Promise.all(ids.map(function(id) {
      return self.loadModule(id, MODULE_REGISTRY[id]);
    }));
  }

  async loadModule(id, config) {
    var storageKey = STORAGE_PREFIX + id;
    var cachedData = localStorage.getItem(storageKey);
    if (cachedData) {
      try {
        var cached = JSON.parse(cachedData);
        if (cached.version === config.version) {
          Logger.info('Модуль ' + id + ' актуален (v' + cached.version + ')');
          this.executeModule(id, cached.code);
          this.moduleStatus.set(id, this.loadedModules.has(id) ? 'loaded' : 'error');
          return;
        }
      } catch (e) { Logger.warn('Ошибка чтения кэша ' + id); }
    }
    Logger.info('Загрузка модуля ' + id + '...');
    this.moduleStatus.set(id, 'loading');
    this.renderModuleList();

    try {
      var controller = new AbortController();
      this.fetchController = controller;
      var timeoutId = setTimeout(function() { controller.abort(); }, FETCH_TIMEOUT_MS);

      var response = await fetch(config.url, { signal: controller.signal });
      clearTimeout(timeoutId);
      this.fetchController = null;

      if (!response.ok) throw new Error('HTTP ' + response.status);
      var code = await response.text();
      localStorage.setItem(storageKey, JSON.stringify({ version: config.version, code: code, loadedAt: Date.now() }));
      Logger.info('Модуль ' + id + ' загружен (v' + config.version + ')');
      this.executeModule(id, code);
      this.moduleStatus.set(id, this.loadedModules.has(id) ? 'loaded' : 'error');
    } catch (error) {
      var msg = error.name === 'AbortError' ? 'Таймаут загрузки' : error.message;
      Logger.error('Ошибка загрузки ' + id + ': ' + msg);
      this.moduleStatus.set(id, 'error');
      if (config.required) {
        if (typeof Notify !== 'undefined') Notify.error('Критическая ошибка: не удалось загрузить модуль «' + config.name + '»');
        else alert('Критическая ошибка: не удалось загрузить модуль "' + config.name + '"');
      }
    }
    this.renderModuleList();
  }

  executeModule(id, code) {
    try {
      var moduleExports = {};
      var moduleContext = { exports: moduleExports, module: { exports: moduleExports } };
      // sourceURL для отладки
      var codeWithSource = code + '\n//# sourceURL=module-' + id + '.js';
      var func = new Function('module', 'exports', 'require', 'Logger', codeWithSource);
      func.call(moduleContext, moduleContext.module, moduleContext.exports, this.require.bind(this), Logger);
      this.loadedModules.set(id, moduleContext.module.exports);
      Logger.info('Модуль ' + id + ' выполнен');
    } catch (error) {
      Logger.error('Ошибка выполнения ' + id + ': ' + error.message);
      this.moduleStatus.set(id, 'error');
    }
  }

  require(moduleId) {
    if (!this.loadedModules.has(moduleId)) throw new Error('Модуль ' + moduleId + ' не загружен');
    return this.loadedModules.get(moduleId);
  }

  renderModuleList() {
    var container = document.getElementById('moduleList');
    if (!container) return;
    var html = '';
    for (var id in MODULE_REGISTRY) {
      var config = MODULE_REGISTRY[id];
      var status = this.moduleStatus.get(id) || 'loading';
      var statusText = { 'loaded': 'Загружен', 'loading': 'Загрузка...', 'error': 'Ошибка' }[status];
      var statusColor = status === 'loaded' ? 'var(--accent-success)' : status === 'error' ? 'var(--accent-error)' : 'var(--accent-gold)';
      html += '<div class="module-item ' + status + '">';
      html += '<div style="flex:1;min-width:200px"><div style="font-weight:600;font-size:1.05em">' + config.name + '</div>';
      html += '<div class="text-small" style="margin-top:4px">' + config.description + '</div>';
      html += '<div class="text-small" style="margin-top:4px">v' + config.version + ' · <span style="color:' + statusColor + '">' + statusText + '</span></div></div>';
      html += '<div style="display:flex;gap:8px">';
      if (status === 'error') html += '<button class="btn btn-secondary" onclick="moduleManager.retryModule(\'' + id + '\')" style="padding:8px 14px" aria-label="Повторить"><i class="ph ph-arrows-clockwise"></i></button>';
      html += '<button class="btn btn-danger" onclick="moduleManager.clearModule(\'' + id + '\')" style="padding:8px 14px" aria-label="Удалить"><i class="ph ph-trash"></i></button>';
      html += '</div></div>';
    }
    container.innerHTML = html;
  }

  initializeUserInterface() {
    Logger.info('Инициализация пользовательского интерфейса...');
    this.loadedModules.forEach(function(module, id) {
      if (module && module.init) {
        try {
          Logger.info('Вызов init() для модуля ' + id + '...');
          module.init();
          Logger.info('Модуль ' + id + ' инициализирован');
        } catch (error) {
          Logger.error('Ошибка инициализации ' + id + ': ' + error.message);
          console.error('Error in module ' + id + ':', error);
        }
      }
    });
    updateSidebarProfile();
    updateHeaderLevel();
  }

  async retryModule(id) {
    var config = MODULE_REGISTRY[id];
    if (config) { localStorage.removeItem(STORAGE_PREFIX + id); await this.loadModule(id, config); }
  }

  clearModule(id) {
    if (!confirm('Удалить модуль "' + MODULE_REGISTRY[id].name + '" из кэша?')) return;
    localStorage.removeItem(STORAGE_PREFIX + id);
    this.loadedModules.delete(id);
    this.moduleStatus.delete(id);
    this.renderModuleList();
    Logger.info('Модуль ' + id + ' удалён из кэша');
  }

  async checkAllModules() {
    Logger.info('Проверка обновлений...');
    await this.loadAllModules();
    this.initializeUserInterface();
    if (typeof Notify !== 'undefined') Notify.success('Все модули проверены!'); else alert('Все модули проверены!');
  }

  clearAllCache() {
    if (!confirm('Удалить все модули из кэша?')) return;
    Object.keys(localStorage).forEach(function(key) {
      if (key.indexOf(STORAGE_PREFIX) === 0) localStorage.removeItem(key);
    });
    this.loadedModules.clear();
    this.moduleStatus.clear();
    this.renderModuleList();
    location.reload();
  }
}

/* ============================================================
   Глобальные обработчики ошибок
   ============================================================ */
window.addEventListener('error', function(e) {
  Logger.error('Глобальная ошибка: ' + (e.message || 'unknown') + (e.filename ? ' @ ' + e.filename + ':' + e.lineno : ''));
});
window.addEventListener('unhandledrejection', function(e) {
  Logger.error('Unhandled promise rejection: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)));
});

/* ============================================================
   Инициализация
   ============================================================ */
var moduleManager = new ModuleManager();
document.addEventListener('DOMContentLoaded', function() {
  switchMode('user');
  moduleManager.init();
});
</script>
</body>
