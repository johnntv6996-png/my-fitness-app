<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FITNESS ELITE — Premium Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-primary: #0a0a0f;
  --bg-secondary: #151520;
  --bg-card: rgba(255, 255, 255, 0.03);
  --bg-glass: rgba(255, 255, 255, 0.05);
  --text-primary: #ffffff;
  --text-secondary: #a0a0b0;
  --accent-gold: #d4af37;
  --accent-gold-light: #f4d03f;
  --accent-platinum: #e5e4e2;
  --accent-neon: #00d4ff;
  --accent-success: #00ff88;
  --accent-error: #ff3366;
  --accent-warning: #ffaa00;
  --border-subtle: rgba(255, 255, 255, 0.08);
  --border-gold: rgba(212, 175, 55, 0.3);
  --shadow-gold: 0 0 40px rgba(212, 175, 55, 0.2);
  --shadow-neon: 0 0 30px rgba(0, 212, 255, 0.3);
  --font-primary: 'Inter', sans-serif;
  --font-display: 'Playfair Display', serif;
  --radius-sm: 8px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --radius-xl: 32px;
  --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-smooth: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
}

* { 
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: var(--font-primary);
  font-size: 16px;
  padding: 20px;
  overflow-x: hidden;
  background-image: 
    radial-gradient(circle at 20% 50%, rgba(212, 175, 55, 0.05) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(0, 212, 255, 0.05) 0%, transparent 50%);
}

.container { 
  max-width: 1200px; 
  margin: 0 auto;
  animation: fadeIn 0.8s ease-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* HEADER */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 28px 36px;
  background: linear-gradient(135deg, rgba(212, 175, 55, 0.08) 0%, rgba(0, 212, 255, 0.05) 100%);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  border-radius: var(--radius-lg);
  margin-bottom: 28px;
  border: 1px solid var(--border-gold);
  box-shadow: var(--shadow-gold);
  position: relative;
  overflow: hidden;
}

.header::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
  animation: shimmer 3s ease-in-out infinite;
}

@keyframes shimmer {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 1; }
}

.header h1 { 
  margin: 0; 
  font-family: var(--font-display);
  font-size: 2em;
  font-weight: 900;
  background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-gold-light) 50%, var(--accent-gold) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.02em;
}

.mode-switcher { 
  display: flex; 
  gap: 12px; 
  align-items: center; 
}

.mode-btn {
  padding: 12px 24px;
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-md);
  background: var(--bg-glass);
  backdrop-filter: blur(10px);
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 0.9em;
  font-weight: 500;
  transition: all var(--transition-fast);
  position: relative;
  overflow: hidden;
}

.mode-btn:hover { 
  background: rgba(255, 255, 255, 0.08);
  color: var(--text-primary);
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(0, 0, 0, 0.3);
}

.mode-btn.active { 
  background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-gold-light) 100%);
  color: #000;
  border-color: var(--accent-gold);
  font-weight: 600;
  box-shadow: var(--shadow-gold);
}

/* NAVIGATION */
.nav {
  display: flex;
  gap: 8px;
  margin-bottom: 28px;
  padding: 8px;
  background: var(--bg-glass);
  backdrop-filter: blur(20px);
  border-radius: var(--radius-md);
  border: 1px solid var(--border-subtle);
  overflow-x: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--accent-gold) transparent;
}

.nav::-webkit-scrollbar {
  height: 4px;
}

.nav::-webkit-scrollbar-thumb {
  background: var(--accent-gold);
  border-radius: 2px;
}

.nav-btn {
  background: transparent;
  border: none;
  color: var(--text-secondary);
  padding: 14px 24px;
  cursor: pointer;
  font-size: 0.95em;
  font-weight: 500;
  border-radius: var(--radius-sm);
  white-space: nowrap;
  transition: all var(--transition-fast);
  position: relative;
  overflow: hidden;
}

.nav-btn::before {
  content: '';
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 2px;
  background: var(--accent-gold);
  transition: width var(--transition-fast);
}

.nav-btn:hover { 
  color: var(--text-primary);
  background: rgba(255, 255, 255, 0.05);
}

.nav-btn:hover::before {
  width: 80%;
}

.nav-btn.active { 
  color: var(--accent-gold);
  background: rgba(212, 175, 55, 0.1);
  font-weight: 600;
}

.nav-btn.active::before {
  width: 100%;
}

/* SCREENS */
.screen { 
  display: none;
  animation: slideIn 0.4s ease-out;
}

.screen.active { 
  display: block;
}

@keyframes slideIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* DEV PANELS */
.dev-panel {
  background: var(--bg-glass);
  backdrop-filter: blur(20px);
  padding: 28px;
  border-radius: var(--radius-lg);
  margin-bottom: 24px;
  border: 1px solid var(--border-subtle);
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
}

.module-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 24px;
  background: var(--bg-card);
  border-radius: var(--radius-md);
  margin-bottom: 16px;
  border: 1px solid var(--border-subtle);
  transition: all var(--transition-fast);
}

.module-item:hover {
  background: rgba(255, 255, 255, 0.05);
  transform: translateX(4px);
  border-color: var(--border-gold);
}

.module-item.loaded { border-left: 3px solid var(--accent-success); }
.module-item.loading { border-left: 3px solid var(--accent-gold); }
.module-item.error { border-left: 3px solid var(--accent-error); }

/* BUTTONS */
.btn {
  padding: 14px 28px;
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  font-weight: 600;
  font-size: 0.95em;
  transition: all var(--transition-fast);
  position: relative;
  overflow: hidden;
}

.btn::before {
  content: '';
  position: absolute;
  top: 50%;
  left: 50%;
  width: 0;
  height: 0;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.3);
  transform: translate(-50%, -50%);
  transition: width 0.6s, height 0.6s;
}

.btn:active::before {
  width: 300px;
  height: 300px;
}

.btn:active { 
  transform: scale(0.95);
}

.btn-primary { 
  background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-gold-light) 100%);
  color: #000;
  box-shadow: var(--shadow-gold);
}

.btn-primary:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(212, 175, 55, 0.4);
}

.btn-secondary { 
  background: var(--bg-glass);
  color: var(--text-primary);
  border: 1px solid var(--border-subtle);
}

.btn-secondary:hover {
  background: rgba(255, 255, 255, 0.08);
  transform: translateY(-2px);
}

.btn-danger { 
  background: linear-gradient(135deg, var(--accent-error) 0%, #ff5577 100%);
  color: #fff;
  box-shadow: 0 4px 20px rgba(255, 51, 102, 0.3);
}

.btn-danger:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 30px rgba(255, 51, 102, 0.5);
}

/* CONSOLE */
.console-log {
  background: #000;
  color: var(--accent-success);
  padding: 24px;
  border-radius: var(--radius-md);
  font-family: 'Courier New', monospace;
  font-size: 0.85em;
  max-height: 400px;
  overflow-y: auto;
  margin-top: 20px;
  border: 1px solid var(--border-subtle);
  box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5);
}

.console-log .error { color: var(--accent-error); }
.console-log .warn { color: var(--accent-warning); }
.console-log .info { color: var(--accent-neon); }

/* LOADING */
.loading { 
  text-align: center; 
  padding: 80px 40px;
  opacity: 0.6;
}

.loading h2 {
  font-family: var(--font-display);
  font-size: 2.5em;
  margin-bottom: 20px;
  background: linear-gradient(135deg, var(--accent-gold), var(--accent-gold-light));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.text-small { 
  font-size: 0.85em; 
  opacity: 0.7;
  color: var(--text-secondary);
}

/* MODALS */
.workout-modal, .survey-modal {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.9);
  backdrop-filter: blur(15px);
  z-index: 2000;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  animation: fadeIn 0.3s ease-out;
}

.workout-modal-content, .survey-modal-content {
  background: var(--bg-secondary);
  padding: 40px;
  border-radius: var(--radius-xl);
  width: 100%;
  max-width: 500px;
  max-height: 90vh;
  overflow-y: auto;
  border: 1px solid var(--border-gold);
  box-shadow: var(--shadow-gold);
  animation: scaleIn 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
}

@keyframes scaleIn {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}

/* SCROLLBAR */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

::-webkit-scrollbar-track {
  background: var(--bg-primary);
}

::-webkit-scrollbar-thumb {
  background: var(--accent-gold);
  border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
  background: var(--accent-gold-light);
}

/* RESPONSIVE */
@media (max-width: 768px) {
  body { padding: 12px; }
  .header { padding: 20px 24px; flex-direction: column; gap: 16px; }
  .header h1 { font-size: 1.6em; }
  .mode-btn { padding: 10px 18px; font-size: 0.85em; }
  .nav { padding: 6px; }
  .nav-btn { padding: 12px 18px; font-size: 0.9em; }
  .dev-panel { padding: 20px; }
}
</style>
</head>
<body>
<div class="container">

  <div class="header">
    <h1>💪 FITNESS ELITE</h1>
    <div class="mode-switcher">
      <button class="mode-btn" id="userModeBtn" onclick="switchMode('user')">👤 Пользователь</button>
      <button class="mode-btn" id="devModeBtn" onclick="switchMode('dev')">🛠 Разработчик</button>
    </div>
  </div>

  <div id="userInterface">
    <div class="nav" id="userNav"></div>
    <div id="screen-welcome" class="screen active">
      <div class="loading">
        <div style="font-size:5em;margin-bottom:20px;animation:pulse 2s infinite">💪</div>
        <h2>Добро пожаловать!</h2>
        <p class="text-small">Загрузка модулей...</p>
      </div>
    </div>
  </div>

  <div id="devInterface" style="display:none">
    <div class="nav">
      <button class="nav-btn active" onclick="showDevScreen('modules')">📦 Модули</button>
      <button class="nav-btn" onclick="showDevScreen('console')">📋 Логи</button>
    </div>
    <div id="dev-screen-modules" class="screen active">
      <div class="dev-panel">
        <h3 style="font-family:var(--font-display);font-size:1.8em;margin-bottom:24px;color:var(--accent-gold)">📦 Управление модулями</h3>
        <div id="moduleList"></div>
        <div style="margin-top:24px;display:flex;gap:16px;flex-wrap:wrap">
          <button class="btn btn-primary" onclick="moduleManager.checkAllModules()">🔄 Проверить обновления</button>
          <button class="btn btn-danger" onclick="moduleManager.clearAllCache()">🗑️ Очистить кэш</button>
        </div>
      </div>
    </div>
    <div id="dev-screen-console" class="screen">
      <div class="dev-panel">
        <h3 style="font-family:var(--font-display);font-size:1.8em;margin-bottom:24px;color:var(--accent-gold)">📋 Системные логи</h3>
        <div class="console-log" id="consoleLog"></div>
        <button class="btn btn-secondary" onclick="clearConsole()" style="margin-top:20px">Очистить логи</button>
      </div>
    </div>
  </div>

</div>

<script>
const Logger = {
  logs: [],
  log: function(message, type) {
    type = type || 'info';
    var timestamp = new Date().toLocaleTimeString();
    this.logs.push({ timestamp: timestamp, message: message, type: type });
    if (type === 'error') console.error('[' + timestamp + '] ' + message);
    else if (type === 'warn') console.warn('[' + timestamp + '] ' + message);
    else console.log('[' + timestamp + '] ' + message);
    this.renderConsole();
  },
  renderConsole: function() {
    var container = document.getElementById('consoleLog');
    if (!container) return;
    var html = '';
    for (var i = 0; i < this.logs.length; i++) {
      var log = this.logs[i];
      html += '<div class="' + log.type + '">[' + log.timestamp + '] ' + log.message + '</div>';
    }
    container.innerHTML = html;
    container.scrollTop = container.scrollHeight;
  },
  clear: function() { this.logs = []; this.renderConsole(); }
};

const MODULE_REGISTRY = {
  'core': {
    name: 'Ядро системы', version: '1.0.0',
    url: 'https://raw.githubusercontent.com/johnntv6996-png/my-fitness-app/main/modules/core.js',
    required: true, description: 'Базовый функционал: навигация, хранилище, утилиты'
  },
  'welcome': {
    name: 'Приветствие', version: '4.0.0',
    url: 'https://raw.githubusercontent.com/johnntv6996-png/my-fitness-app/main/modules/welcome.js',
    required: false, description: 'Экран приветствия с именем пользователя'
  },
  'exercises': {
    name: 'База упражнений', version: '3.0.0',
    url: 'https://raw.githubusercontent.com/johnntv6996-png/my-fitness-app/main/modules/exercises.js',
    required: false, description: 'CRUD упражнений с категориями, звёздами, картинками'
  },
  'plan': {
    name: 'План тренировок', version: '2.0.0',
    url: 'https://raw.githubusercontent.com/johnntv6996-png/my-fitness-app/main/modules/plan.js',
    required: false, description: 'Настройка плана на неделю с табами'
  },
  'workout': {
    name: 'Тренировка', version: '1.0.0',
    url: 'https://raw.githubusercontent.com/johnntv6996-png/my-fitness-app/main/modules/workout.js',
    required: false, description: 'Главный экран тренировки с подходами и мини-опросом'
  },
  'stats': {
    name: 'Статистика', version: '1.0.0',
    url: 'https://raw.githubusercontent.com/johnntv6996-png/my-fitness-app/main/modules/stats.js',
    required: false, description: 'Графики, тепловая карта, стрики'
  },
  'survey': {
    name: 'Опросы', version: '1.0.0',
    url: 'https://raw.githubusercontent.com/johnntv6996-png/my-fitness-app/main/modules/survey.js',
    required: false, description: 'Конструктор опросов и финальный опрос после тренировки'
  },
  'settings': {
    name: 'Настройки', version: '1.0.0',
    url: 'https://raw.githubusercontent.com/johnntv6996-png/my-fitness-app/main/modules/settings.js',
    required: false, description: 'Имя, аватар, общие настройки'
  }
};

const STORAGE_PREFIX = 'ft_module_';

class ModuleManager {
  constructor() {
    this.loadedModules = new Map();
    this.moduleStatus = new Map();
  }

  async init() {
    Logger.log('🚀 Инициализация менеджера модулей...', 'info');
    await this.loadAllModules();
    this.renderModuleList();
    var self = this;
    setTimeout(function() { self.initializeUserInterface(); }, 100);
  }

  async loadAllModules() {
    for (var id in MODULE_REGISTRY) {
      await this.loadModule(id, MODULE_REGISTRY[id]);
    }
  }

  async loadModule(id, config) {
    var storageKey = STORAGE_PREFIX + id;
    var cachedData = localStorage.getItem(storageKey);

    if (cachedData) {
      try {
        var cached = JSON.parse(cachedData);
        if (cached.version === config.version) {
          Logger.log('✅ Модуль ' + id + ' актуален (v' + cached.version + ')', 'info');
          this.executeModule(id, cached.code);
          this.moduleStatus.set(id, 'loaded');
          return;
        }
      } catch (e) {
        Logger.log('⚠️ Ошибка чтения кэша ' + id, 'warn');
      }
    }

    Logger.log('⬇️ Загрузка модуля ' + id + '...', 'info');
    this.moduleStatus.set(id, 'loading');
    this.renderModuleList();

    try {
      var response = await fetch(config.url);
      if (!response.ok) throw new Error('HTTP ' + response.status);
      var code = await response.text();
      localStorage.setItem(storageKey, JSON.stringify({ version: config.version, code: code, loadedAt: Date.now() }));
      Logger.log('✅ Модуль ' + id + ' загружен (v' + config.version + ')', 'info');
      this.executeModule(id, code);
      this.moduleStatus.set(id, 'loaded');
    } catch (error) {
      Logger.log('❌ Ошибка загрузки ' + id + ': ' + error.message, 'error');
      this.moduleStatus.set(id, 'error');
      if (config.required) alert('Критическая ошибка: не удалось загрузить модуль "' + config.name + '"');
    }
    this.renderModuleList();
  }

  executeModule(id, code) {
    try {
      var moduleExports = {};
      var moduleContext = { exports: moduleExports, module: { exports: moduleExports } };
      var func = new Function('module', 'exports', 'require', 'Logger', code);
      func.call(moduleContext, moduleContext.module, moduleContext.exports, this.require.bind(this), Logger);
      this.loadedModules.set(id, moduleContext.module.exports);
      Logger.log('📦 Модуль ' + id + ' выполнен', 'info');
    } catch (error) {
      Logger.log('❌ Ошибка выполнения ' + id + ': ' + error.message, 'error');
      this.moduleStatus.set(id, 'error');
    }
  }

  require(moduleId) {
    if (!this.loadedModules.has(moduleId)) throw new Error('Модуль ' + moduleId + ' не загружен');
    return this.loadedModules.get(moduleId);
  }

  renderModuleList() {
    var container = document.getElementById('moduleList');
    if (!container) return;
    var html = '';
    for (var id in MODULE_REGISTRY) {
      var config = MODULE_REGISTRY[id];
      var status = this.moduleStatus.get(id) || 'loading';
      var statusText = { 'loaded': '✅ Загружен', 'loading': '⏳ Загрузка...', 'error': '❌ Ошибка' }[status];
      html += '<div class="module-item ' + status + '">';
      html += '<div style="flex:1"><div style="font-weight:600;font-size:1.1em">' + config.name + '</div>';
      html += '<div class="text-small" style="margin-top:4px">' + config.description + '</div>';
      html += '<div class="text-small" style="margin-top:4px">v' + config.version + ' · ' + statusText + '</div></div>';
      html += '<div style="display:flex;gap:8px">';
      if (status === 'error') html += '<button class="btn btn-secondary" onclick="moduleManager.retryModule(\'' + id + '\')" style="padding:8px 16px">🔄</button>';
      html += '<button class="btn btn-danger" onclick="moduleManager.clearModule(\'' + id + '\')" style="padding:8px 16px">🗑️</button>';
      html += '</div></div>';
    }
    container.innerHTML = html;
  }

  initializeUserInterface() {
    Logger.log('🎨 Инициализация пользовательского интерфейса...', 'info');
    var nav = document.getElementById('userNav');
    if (nav) nav.innerHTML = '';
    this.loadedModules.forEach(function(module, id) {
      if (module && module.init) {
        try {
          Logger.log('🔄 Вызов init() для модуля ' + id + '...', 'info');
          module.init();
          Logger.log('✅ Модуль ' + id + ' инициализирован', 'info');
        } catch (error) {
          Logger.log('❌ Ошибка инициализации ' + id + ': ' + error.message, 'error');
          console.error('Error in module ' + id + ':', error);
        }
      }
    });
    if (typeof Core !== 'undefined' && Core.enableDragReorder) {
      Core.enableDragReorder();
    }
  }

  async retryModule(id) {
    var config = MODULE_REGISTRY[id];
    if (config) {
      localStorage.removeItem(STORAGE_PREFIX + id);
      await this.loadModule(id, config);
    }
  }

  clearModule(id) {
    if (confirm('Удалить модуль "' + MODULE_REGISTRY[id].name + '" из кэша?')) {
      localStorage.removeItem(STORAGE_PREFIX + id);
      this.loadedModules.delete(id);
      this.moduleStatus.delete(id);
      this.renderModuleList();
      Logger.log('🗑️ Модуль ' + id + ' удалён из кэша', 'info');
    }
  }

  async checkAllModules() {
    Logger.log('🔄 Проверка обновлений...', 'info');
    await this.loadAllModules();
    this.initializeUserInterface();
    alert('✅ Все модули проверены!');
  }

  clearAllCache() {
    if (confirm('Удалить все модули из кэша?')) {
      Object.keys(localStorage).forEach(function(key) {
        if (key.startsWith(STORAGE_PREFIX)) localStorage.removeItem(key);
      });
      this.loadedModules.clear();
      this.moduleStatus.clear();
      this.renderModuleList();
      location.reload();
    }
  }
}

var currentMode = 'user';
function switchMode(mode) {
  currentMode = mode;
  document.getElementById('userInterface').style.display = mode === 'user' ? 'block' : 'none';
  document.getElementById('devInterface').style.display = mode === 'dev' ? 'block' : 'none';
  document.getElementById('userModeBtn').classList.toggle('active', mode === 'user');
  document.getElementById('devModeBtn').classList.toggle('active', mode === 'dev');
  Logger.log('🔄 Переключено в режим: ' + (mode === 'user' ? 'Пользователь' : 'Разработчик'), 'info');
}

function showDevScreen(screenId) {
  document.querySelectorAll('#devInterface .screen').forEach(function(s) { s.classList.remove('active'); });
  document.querySelectorAll('#devInterface .nav-btn').forEach(function(b) { b.classList.remove('active'); });
  document.getElementById('dev-screen-' + screenId).classList.add('active');
  if (event && event.target) event.target.classList.add('active');
}

function clearConsole() { Logger.clear(); }

var moduleManager = new ModuleManager();
document.addEventListener('DOMContentLoaded', function() {
  switchMode('user');
  moduleManager.init();
});
</script>
