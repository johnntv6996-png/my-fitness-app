<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FITNESS ELITE — Premium Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web"></script>
<style>
:root {
  --bg-primary: #0a0a0f;
  --bg-secondary: #151520;
  --bg-card: rgba(255, 255, 255, 0.03);
  --bg-glass: rgba(255, 255, 255, 0.05);
  --text-primary: #ffffff;
  --text-secondary: #a0a0b0;
  --text-muted: #6a6a7a;
  --accent-gold: #d4af37;
  --accent-gold-light: #f4d03f;
  --accent-gold-dim: rgba(212, 175, 55, 0.15);
  --accent-success: #4ade80;
  --accent-error: #f87171;
  --accent-warning: #fbbf24;
  --accent-info: #60a5fa;
  --border-subtle: rgba(255, 255, 255, 0.08);
  --border-gold: rgba(212, 175, 55, 0.3);
  --shadow-gold: 0 0 40px rgba(212, 175, 55, 0.2);
  --font-primary: 'Inter', sans-serif;
  --font-display: 'Playfair Display', serif;
  --radius-sm: 8px;
  --radius-md: 16px;
  --radius-lg: 24px;
  --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-family: var(--font-primary);
  font-size: 16px;
  overflow-x: hidden;
  background-image: 
    radial-gradient(circle at 20% 50%, rgba(212, 175, 55, 0.05) 0%, transparent 50%),
    radial-gradient(circle at 80% 80%, rgba(212, 175, 55, 0.03) 0%, transparent 50%);
}

/* SELECT / COMBOBOX — тёмная тема */
select, input[type="text"], input[type="number"], input[type="time"], input[type="date"], textarea {
  background: var(--bg-primary) !important;
  color: var(--text-primary) !important;
  border: 1px solid var(--border-subtle) !important;
  font-family: var(--font-primary);
}

select:focus, input:focus, textarea:focus {
  outline: none;
  border-color: var(--border-gold) !important;
}

select option {
  background: var(--bg-secondary) !important;
  color: var(--text-primary) !important;
  padding: 8px;
}

/* HEADER */
.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 20px 28px;
  background: linear-gradient(135deg, rgba(212, 175, 55, 0.08) 0%, rgba(212, 175, 55, 0.03) 100%);
  backdrop-filter: blur(30px);
  -webkit-backdrop-filter: blur(30px);
  border-radius: var(--radius-lg);
  margin-bottom: 20px;
  border: 1px solid var(--border-gold);
  box-shadow: var(--shadow-gold);
  position: relative;
  overflow: hidden;
  cursor: pointer;
  transition: all var(--transition-fast);
}

.header:hover { box-shadow: 0 0 60px rgba(212, 175, 55, 0.3); }

.header::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--accent-gold), transparent);
  animation: shimmer 3s ease-in-out infinite;
}

@keyframes shimmer {
  0%, 100% { opacity: 0.5; }
  50% { opacity: 1; }
}

.header-left {
  display: flex;
  align-items: center;
  gap: 16px;
}

.header h1 { 
  margin: 0; 
  font-family: var(--font-display);
  font-size: 1.8em;
  font-weight: 900;
  background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-gold-light) 50%, var(--accent-gold) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  letter-spacing: -0.02em;
  display: flex;
  align-items: center;
  gap: 12px;
}

.header h1 i {
  font-size: 1.1em;
  -webkit-text-fill-color: var(--accent-gold);
}

.hamburger {
  width: 44px; height: 44px;
  background: var(--bg-glass);
  border: 1px solid var(--border-subtle);
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 5px;
  transition: all var(--transition-fast);
  flex-shrink: 0;
}

.hamburger:hover { background: rgba(212, 175, 55, 0.1); border-color: var(--border-gold); }

.hamburger span {
  display: block;
  width: 22px; height: 2px;
  background: var(--accent-gold);
  border-radius: 2px;
  transition: all var(--transition-fast);
}

.hamburger.active span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
.hamburger.active span:nth-child(2) { opacity: 0; }
.hamburger.active span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

/* SIDEBAR */
.sidebar-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.7);
  backdrop-filter: blur(8px);
  z-index: 998;
  opacity: 0;
  visibility: hidden;
  transition: all var(--transition-fast);
}

.sidebar-overlay.active { opacity: 1; visibility: visible; }

.sidebar {
  position: fixed;
  top: 0; left: 0;
  width: 320px;
  max-width: 85vw;
  height: 100vh;
  background: linear-gradient(180deg, var(--bg-secondary) 0%, var(--bg-primary) 100%);
  border-right: 1px solid var(--border-gold);
  z-index: 999;
  transform: translateX(-100%);
  transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  overflow-y: auto;
  padding: 24px 0;
  box-shadow: 10px 0 40px rgba(0, 0, 0, 0.5);
}

.sidebar.active { transform: translateX(0); }

.sidebar-header {
  padding: 0 24px 20px;
  border-bottom: 1px solid var(--border-subtle);
  margin-bottom: 16px;
}

.sidebar-header h2 {
  font-family: var(--font-display);
  color: var(--accent-gold);
  font-size: 1.3em;
  display: flex;
  align-items: center;
  gap: 10px;
}

/* Профиль в sidebar */
.sidebar-profile {
  padding: 16px 24px;
  margin-bottom: 16px;
  border-bottom: 1px solid var(--border-subtle);
  cursor: pointer;
  transition: all var(--transition-fast);
}

.sidebar-profile:hover {
  background: var(--accent-gold-dim);
}

.sidebar-profile-content {
  display: flex;
  align-items: center;
  gap: 12px;
}

.sidebar-profile-avatar {
  width: 48px;
  height: 48px;
  border-radius: 50%;
  border: 2px solid var(--border-gold);
  overflow: hidden;
  background: var(--bg-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

.sidebar-profile-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.sidebar-profile-avatar i {
  font-size: 1.8em;
  color: var(--accent-gold);
}

.sidebar-profile-info {
  flex: 1;
  min-width: 0;
}

.sidebar-profile-name {
  font-weight: 600;
  font-size: 1em;
  color: var(--text-primary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.sidebar-profile-sub {
  font-size: 0.8em;
  color: var(--text-secondary);
  margin-top: 2px;
}

.sidebar-section { padding: 0 16px; margin-bottom: 20px; }

.sidebar-section-title {
  font-size: 0.75em;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--text-secondary);
  opacity: 0.6;
  padding: 0 12px 8px;
  font-weight: 600;
}

.sidebar-item {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 14px 16px;
  margin-bottom: 4px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  color: var(--text-secondary);
  font-weight: 500;
  font-size: 0.95em;
  transition: all var(--transition-fast);
  border: 1px solid transparent;
}

.sidebar-item:hover {
  background: var(--accent-gold-dim);
  color: var(--text-primary);
  border-color: var(--border-subtle);
  transform: translateX(4px);
}

.sidebar-item.active {
  background: var(--accent-gold-dim);
  color: var(--accent-gold);
  border-color: var(--border-gold);
  font-weight: 600;
}

.sidebar-item i {
  font-size: 1.3em;
  width: 24px;
  text-align: center;
  color: var(--accent-gold);
}

/* MAIN CONTENT */
.main-content {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 20px 40px;
  animation: fadeIn 0.5s ease-out;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

.screen { display: none; }
.screen.active { display: block; animation: fadeIn 0.4s ease-out; }

/* DEV PANELS */
.dev-panel {
  background: var(--bg-glass);
  backdrop-filter: blur(20px);
  padding: 28px;
  border-radius: var(--radius-lg);
  margin-bottom: 24px;
  border: 1px solid var(--border-subtle);
}

.module-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 18px 20px;
  background: var(--bg-card);
  border-radius: var(--radius-md);
  margin-bottom: 12px;
  border: 1px solid var(--border-subtle);
  transition: all var(--transition-fast);
  flex-wrap: wrap;
  gap: 12px;
}

.module-item:hover {
  background: rgba(255, 255, 255, 0.05);
  transform: translateX(4px);
  border-color: var(--border-gold);
}

.module-item.loaded { border-left: 3px solid var(--accent-success); }
.module-item.loading { border-left: 3px solid var(--accent-gold); }
.module-item.error { border-left: 3px solid var(--accent-error); }

/* BUTTONS */
.btn {
  padding: 12px 22px;
  border: none;
  border-radius: var(--radius-md);
  cursor: pointer;
  font-weight: 600;
  font-size: 0.95em;
  transition: all var(--transition-fast);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  font-family: var(--font-primary);
  white-space: nowrap;
}

.btn:active { transform: scale(0.97); }

.btn-primary { 
  background: linear-gradient(135deg, var(--accent-gold) 0%, var(--accent-gold-light) 100%);
  color: #000;
  box-shadow: var(--shadow-gold);
}

.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 30px rgba(212, 175, 55, 0.4); }

.btn-secondary { 
  background: var(--bg-glass);
  color: var(--text-primary);
  border: 1px solid var(--border-subtle);
}

.btn-secondary:hover { background: rgba(255, 255, 255, 0.08); transform: translateY(-2px); }

.btn-danger { 
  background: linear-gradient(135deg, var(--accent-error) 0%, #ef4444 100%);
  color: #fff;
}

.btn-danger:hover { transform: translateY(-2px); }

.btn-success {
  background: linear-gradient(135deg, var(--accent-success) 0%, #22c55e 100%);
  color: #000;
}

/* CONSOLE */
.console-log {
  background: #000;
  color: var(--accent-success);
  padding: 20px;
  border-radius: var(--radius-md);
  font-family: 'Courier New', monospace;
  font-size: 0.85em;
  max-height: 400px;
  overflow-y: auto;
  margin-top: 16px;
  border: 1px solid var(--border-subtle);
}

.console-log .error { color: var(--accent-error); }
.console-log .warn { color: var(--accent-warning); }
.console-log .info { color: var(--accent-gold); }

/* LOADING */
.loading { text-align: center; padding: 80px 40px; opacity: 0.6; }

.loading h2 {
  font-family: var(--font-display);
  font-size: 2.2em;
  margin: 20px 0;
  background: linear-gradient(135deg, var(--accent-gold), var(--accent-gold-light));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.loading .icon-large {
  font-size: 4em;
  color: var(--accent-gold);
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.7; transform: scale(1.05); }
}

.text-small { font-size: 0.85em; opacity: 0.7; color: var(--text-secondary); }

/* MODALS */
.workout-modal, .survey-modal, .ex-modal {
  position: fixed;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.9);
  backdrop-filter: blur(15px);
  z-index: 2000;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 20px;
  animation: fadeIn 0.3s ease-out;
}

.workout-modal-content, .survey-modal-content, .ex-modal-content {
  background: var(--bg-secondary);
  padding: 32px;
  border-radius: var(--radius-lg);
  width: 100%;
  max-width: 600px;
  max-height: 90vh;
  overflow-y: auto;
  border: 1px solid var(--border-gold);
  box-shadow: var(--shadow-gold);
  animation: scaleIn 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
}

@keyframes scaleIn {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}

/* SCROLLBAR */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: var(--accent-gold); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--accent-gold-light); }

/* RESPONSIVE */
@media (max-width: 768px) {
  body { padding: 0; }
  .header { margin: 10px; padding: 14px 16px; border-radius: var(--radius-md); flex-wrap: wrap; }
  .header h1 { font-size: 1.2em; }
  .header h1 i { font-size: 0.9em; }
  .hamburger { width: 40px; height: 40px; }
  .main-content { padding: 0 12px 40px; }
  .dev-panel { padding: 20px; }
  .module-item { flex-direction: column; align-items: flex-start; }
  .module-item > div:last-child { width: 100%; justify-content: flex-end; }
}

@media (max-width: 480px) {
  .header h1 { font-size: 1em; gap: 8px; }
  .header-left { gap: 10px; }
}
</style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h2><i class="ph ph-barbell"></i> FITNESS ELITE</h2>
  </div>
  <!-- Блок профиля -->
  <div class="sidebar-profile" id="sidebarProfile" onclick="goToSettings()">
    <div class="sidebar-profile-content">
      <div class="sidebar-profile-avatar" id="sidebarAvatar">
        <i class="ph ph-user-circle"></i>
      </div>
      <div class="sidebar-profile-info">
        <div class="sidebar-profile-name" id="sidebarName">Гость</div>
        <div class="sidebar-profile-sub">Нажми, чтобы изменить</div>
      </div>
    </div>
  </div>
  <div class="sidebar-section" id="sidebarMenu">
    <div class="sidebar-section-title">Навигация</div>
  </div>
</aside>

<!-- HEADER -->
<div style="max-width:1200px;margin:0 auto;padding:10px">
  <div class="header" id="mainHeader" onclick="goHome()">
    <div class="header-left">
      <button class="hamburger" id="hamburgerBtn" onclick="event.stopPropagation(); toggleSidebar()">
        <span></span><span></span><span></span>
      </button>
      <h1><i class="ph ph-barbell"></i> FITNESS ELITE</h1>
    </div>
  </div>
</div>

<!-- MAIN CONTENT -->
<div class="main-content">
  <div id="userInterface">
    <div id="screen-welcome" class="screen active">
      <div class="loading">
        <i class="ph ph-barbell icon-large"></i>
        <h2>Добро пожаловать</h2>
        <p class="text-small">Загрузка модулей...</p>
      </div>
    </div>
  </div>

  <div id="devInterface" style="display:none">
    <div class="dev-panel">
      <h3 style="font-family:var(--font-display);font-size:1.6em;margin-bottom:20px;color:var(--accent-gold);display:flex;align-items:center;gap:10px">
        <i class="ph ph-cube"></i> Управление модулями
      </h3>
      <div id="moduleList"></div>
      <div style="margin-top:20px;display:flex;gap:12px;flex-wrap:wrap">
        <button class="btn btn-primary" onclick="moduleManager.checkAllModules()">
          <i class="ph ph-arrows-clockwise"></i> Проверить обновления
        </button>
        <button class="btn btn-danger" onclick="moduleManager.clearAllCache()">
          <i class="ph ph-trash"></i> Очистить кэш
        </button>
      </div>
    </div>
    <div class="dev-panel">
      <h3 style="font-family:var(--font-display);font-size:1.6em;margin-bottom:20px;color:var(--accent-gold);display:flex;align-items:center;gap:10px">
        <i class="ph ph-scroll"></i> Системные логи
      </h3>
      <div class="console-log" id="consoleLog"></div>
      <button class="btn btn-secondary" onclick="clearConsole()" style="margin-top:16px">
        <i class="ph ph-eraser"></i> Очистить логи
      </button>
    </div>
  </div>
</div>

<script>
const Logger = {
  logs: [],
  log: function(message, type) {
    type = type || 'info';
    var timestamp = new Date().toLocaleTimeString();
    this.logs.push({ timestamp: timestamp, message: message, type: type });
    if (type === 'error') console.error('[' + timestamp + '] ' + message);
    else if (type === 'warn') console.warn('[' + timestamp + '] ' + message);
    else console.log('[' + timestamp + '] ' + message);
    this.renderConsole();
  },
  renderConsole: function() {
    var container = document.getElementById('consoleLog');
    if (!container) return;
    var html = '';
    for (var i = 0; i < this.logs.length; i++) {
      var log = this.logs[i];
      html += '<div class="' + log.type + '">[' + log.timestamp + '] ' + log.message + '</div>';
    }
    container.innerHTML = html;
    container.scrollTop = container.scrollHeight;
  },
  clear: function() { this.logs = []; this.renderConsole(); }
};

const MODULE_REGISTRY = {
  'core': { name: 'Ядро системы', version: '2.2.0',
    url: 'https://raw.githubusercontent.com/johnntv6996-png/my-fitness-app/main/modules/core.js',
    required: true, description: 'Базовый функционал' },
  'welcome': { name: 'Главная', version: '5.2.0',
    url: 'https://raw.githubusercontent.com/johnntv6996-png/my-fitness-app/main/modules/welcome.js',
    required: false, description: 'Экран приветствия' },
  'exercises': { name: 'База упражнений', version: '4.2.0',
    url: 'https://raw.githubusercontent.com/johnntv6996-png/my-fitness-app/main/modules/exercises.js',
    required: false, description: 'CRUD упражнений' },
  'plan': { name: 'План тренировок', version: '3.2.0',
    url: 'https://raw.githubusercontent.com/johnntv6996-png/my-fitness-app/main/modules/plan.js',
    required: false, description: 'Настройка плана' },
  'workout': { name: 'Тренировка', version: '2.2.0',
    url: 'https://raw.githubusercontent.com/johnntv6996-png/my-fitness-app/main/modules/workout.js',
    required: false, description: 'Экран тренировки' },
  'stats': { name: 'Статистика', version: '3.0.0',
    url: 'https://raw.githubusercontent.com/johnntv6996-png/my-fitness-app/main/modules/stats.js',
    required: false, description: 'Графики и аналитика' },
  'survey': { name: 'Опросы', version: '2.2.0',
    url: 'https://raw.githubusercontent.com/johnntv6996-png/my-fitness-app/main/modules/survey.js',
    required: false, description: 'Конструктор опросов' },
  'settings': { name: 'Настройки', version: '2.2.0',
    url: 'https://raw.githubusercontent.com/johnntv6996-png/my-fitness-app/main/modules/settings.js',
    required: false, description: 'Профиль и параметры' }
};

const STORAGE_PREFIX = 'ft_module_';

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('active');
  document.getElementById('sidebarOverlay').classList.toggle('active');
  document.getElementById('hamburgerBtn').classList.toggle('active');
}

function goHome() {
  if (typeof Core !== 'undefined') Core.navigate('welcome');
  window.scrollTo({ top: 0, behavior: 'smooth' });
  if (document.getElementById('sidebar').classList.contains('active')) toggleSidebar();
}

function goToSettings() {
  if (typeof Core !== 'undefined') Core.navigate('settings');
  if (document.getElementById('sidebar').classList.contains('active')) toggleSidebar();
}

function switchMode(mode) {
  document.getElementById('userInterface').style.display = mode === 'user' ? 'block' : 'none';
  document.getElementById('devInterface').style.display = mode === 'dev' ? 'block' : 'none';
}

function clearConsole() { Logger.clear(); }

// Обновление профиля в sidebar
function updateSidebarProfile() {
  var nameEl = document.getElementById('sidebarName');
  var avatarEl = document.getElementById('sidebarAvatar');
  if (!nameEl || !avatarEl) return;
  
  var userName = '';
  var userAvatar = null;
  try {
    userName = JSON.parse(localStorage.getItem('ft_user_name')) || '';
    userAvatar = JSON.parse(localStorage.getItem('ft_user_avatar'));
  } catch (e) {}
  
  nameEl.textContent = userName || 'Гость';
  
  if (userAvatar && userAvatar.startsWith('data:image')) {
    avatarEl.innerHTML = '<img src="' + userAvatar + '" alt="avatar">';
  } else if (userAvatar) {
    avatarEl.innerHTML = '<i class="ph ' + userAvatar + '"></i>';
  } else {
    avatarEl.innerHTML = '<i class="ph ph-user-circle"></i>';
  }
}

class ModuleManager {
  constructor() { this.loadedModules = new Map(); this.moduleStatus = new Map(); }

  async init() {
    Logger.log('Инициализация менеджера модулей...', 'info');
    updateSidebarProfile();
    await this.loadAllModules();
    this.renderModuleList();
    var self = this;
    setTimeout(function() { self.initializeUserInterface(); }, 100);
  }

  async loadAllModules() { for (var id in MODULE_REGISTRY) await this.loadModule(id, MODULE_REGISTRY[id]); }

  async loadModule(id, config) {
    var storageKey = STORAGE_PREFIX + id;
    var cachedData = localStorage.getItem(storageKey);
    if (cachedData) {
      try {
        var cached = JSON.parse(cachedData);
        if (cached.version === config.version) {
          Logger.log('Модуль ' + id + ' актуален (v' + cached.version + ')', 'info');
          this.executeModule(id, cached.code);
          this.moduleStatus.set(id, 'loaded');
          return;
        }
      } catch (e) { Logger.log('Ошибка чтения кэша ' + id, 'warn'); }
    }
    Logger.log('Загрузка модуля ' + id + '...', 'info');
    this.moduleStatus.set(id, 'loading');
    this.renderModuleList();
    try {
      var response = await fetch(config.url);
      if (!response.ok) throw new Error('HTTP ' + response.status);
      var code = await response.text();
      localStorage.setItem(storageKey, JSON.stringify({ version: config.version, code: code, loadedAt: Date.now() }));
      Logger.log('Модуль ' + id + ' загружен (v' + config.version + ')', 'info');
      this.executeModule(id, code);
      this.moduleStatus.set(id, 'loaded');
    } catch (error) {
      Logger.log('Ошибка загрузки ' + id + ': ' + error.message, 'error');
      this.moduleStatus.set(id, 'error');
      if (config.required) alert('Критическая ошибка: не удалось загрузить модуль "' + config.name + '"');
    }
    this.renderModuleList();
  }

  executeModule(id, code) {
    try {
      var moduleExports = {};
      var moduleContext = { exports: moduleExports, module: { exports: moduleExports } };
      var func = new Function('module', 'exports', 'require', 'Logger', code);
      func.call(moduleContext, moduleContext.module, moduleContext.exports, this.require.bind(this), Logger);
      this.loadedModules.set(id, moduleContext.module.exports);
      Logger.log('Модуль ' + id + ' выполнен', 'info');
    } catch (error) {
      Logger.log('Ошибка выполнения ' + id + ': ' + error.message, 'error');
      this.moduleStatus.set(id, 'error');
    }
  }

  require(moduleId) {
    if (!this.loadedModules.has(moduleId)) throw new Error('Модуль ' + moduleId + ' не загружен');
    return this.loadedModules.get(moduleId);
  }

  renderModuleList() {
    var container = document.getElementById('moduleList');
    if (!container) return;
    var html = '';
    for (var id in MODULE_REGISTRY) {
      var config = MODULE_REGISTRY[id];
      var status = this.moduleStatus.get(id) || 'loading';
      var statusText = { 'loaded': 'Загружен', 'loading': 'Загрузка...', 'error': 'Ошибка' }[status];
      html += '<div class="module-item ' + status + '">';
      html += '<div style="flex:1;min-width:200px"><div style="font-weight:600;font-size:1.05em">' + config.name + '</div>';
      html += '<div class="text-small" style="margin-top:4px">' + config.description + '</div>';
      html += '<div class="text-small" style="margin-top:4px">v' + config.version + ' · ' + statusText + '</div></div>';
      html += '<div style="display:flex;gap:8px">';
      if (status === 'error') html += '<button class="btn btn-secondary" onclick="moduleManager.retryModule(\'' + id + '\')" style="padding:8px 14px"><i class="ph ph-arrows-clockwise"></i></button>';
      html += '<button class="btn btn-danger" onclick="moduleManager.clearModule(\'' + id + '\')" style="padding:8px 14px"><i class="ph ph-trash"></i></button>';
      html += '</div></div>';
    }
    container.innerHTML = html;
  }

  initializeUserInterface() {
    Logger.log('Инициализация пользовательского интерфейса...', 'info');
    this.loadedModules.forEach(function(module, id) {
      if (module && module.init) {
        try {
          Logger.log('Вызов init() для модуля ' + id + '...', 'info');
          module.init();
          Logger.log('Модуль ' + id + ' инициализирован', 'info');
        } catch (error) {
          Logger.log('Ошибка инициализации ' + id + ': ' + error.message, 'error');
          console.error('Error in module ' + id + ':', error);
        }
      }
    });
    addDevMenuItem();
    updateSidebarProfile();
  }

  async retryModule(id) {
    var config = MODULE_REGISTRY[id];
    if (config) { localStorage.removeItem(STORAGE_PREFIX + id); await this.loadModule(id, config); }
  }

  clearModule(id) {
    if (confirm('Удалить модуль "' + MODULE_REGISTRY[id].name + '" из кэша?')) {
      localStorage.removeItem(STORAGE_PREFIX + id);
      this.loadedModules.delete(id);
      this.moduleStatus.delete(id);
      this.renderModuleList();
      Logger.log('Модуль ' + id + ' удалён из кэша', 'info');
    }
  }

  async checkAllModules() {
    Logger.log('Проверка обновлений...', 'info');
    await this.loadAllModules();
    this.initializeUserInterface();
    alert('Все модули проверены!');
  }

  clearAllCache() {
    if (confirm('Удалить все модули из кэша?')) {
      Object.keys(localStorage).forEach(function(key) {
        if (key.startsWith(STORAGE_PREFIX)) localStorage.removeItem(key);
      });
      this.loadedModules.clear();
      this.moduleStatus.clear();
      this.renderModuleList();
      location.reload();
    }
  }
}

function addDevMenuItem() {
  var menu = document.getElementById('sidebarMenu');
  if (!menu) return;
  if (menu.querySelector('[data-screen="dev"]')) return;
  var item = document.createElement('div');
  item.className = 'sidebar-item';
  item.setAttribute('data-screen', 'dev');
  item.innerHTML = '<i class="ph ph-code"></i> Панель разработчика';
  item.onclick = function() {
    if (document.getElementById('sidebar').classList.contains('active')) toggleSidebar();
    switchMode('dev');
    document.querySelectorAll('.sidebar-item').forEach(function(b) { b.classList.remove('active'); });
    item.classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };
  menu.appendChild(item);
}

var moduleManager = new ModuleManager();
document.addEventListener('DOMContentLoaded', function() {
  switchMode('user');
  moduleManager.init();
});
</script>
</body>
